[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "u1-sentinel-model"
version = "0.1.0"
description = "Advisory-only security evaluator training pipeline for U1 Sentinel"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=2.20",
  "peft>=0.12",
  "trl>=0.11",
  "accelerate>=0.34",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
yaml = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
