name: Sentinel Model Tests

on:
  push:
    paths:
      - "v2.9-sentinel-model/**"
      - ".github/workflows/sentinel-model-tests.yml"
  pull_request:
    paths:
      - "v2.9-sentinel-model/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.9-sentinel-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
