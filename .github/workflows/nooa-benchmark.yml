name: nooa-authority-lift
on:
  push:
    branches: ['feature/nooa-enterprise-showcase']
  pull_request:
    paths: ['nooa-showcase/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nooa-showcase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python -m benchmarks.run_invariant
