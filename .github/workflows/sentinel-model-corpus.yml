name: Sentinel Model Corpus

on:
  workflow_dispatch:
  push:
    paths:
      - "v2.9-sentinel-model/**"
      - ".github/workflows/sentinel-model-corpus.yml"

jobs:
  corpus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2.9-sentinel-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate train corpus
        run: |
          python -m u1_sentinel_model.dataset             --output data/train-4000.jsonl             --count 4000             --seed 7

      - name: Generate independent eval corpus
        run: |
          python -m u1_sentinel_model.dataset             --output data/eval-1000.jsonl             --count 1000             --seed 20260909

      - name: Build corpus manifest
        run: |
          python scripts/corpus_manifest.py             data/train-4000.jsonl             data/eval-1000.jsonl             --output data/CORPUS_MANIFEST.json

      - uses: actions/upload-artifact@v4
        with:
          name: u1-sentinel-model-corpus
          path: |
            v2.9-sentinel-model/data/train-4000.jsonl
            v2.9-sentinel-model/data/eval-1000.jsonl
            v2.9-sentinel-model/data/CORPUS_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
